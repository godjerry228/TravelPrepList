<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="家庭旅遊行李檢查清單">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>旅遊清單檢查</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/app.css?v=11">

  <!-- SortableJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- SweetAlert2 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-main min-h-screen">

  <!-- 選單按鈕 (固定右上角) -->
  <button id="menuBtn" class="menu-btn glass-dark">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <!-- Header -->
  <header class="header-container pt-6 pb-4">
    <div class="header-icon">🧳</div>
    <h1 class="header-title">旅遊準備清單</h1>
    <p class="header-subtitle">輕鬆打包，快樂出發</p>
  </header>

  <!-- 主內容區 -->
  <main class="container mx-auto px-4 pb-36">
    <!-- 清單容器 -->
    <div id="checklistGrid" class="space-y-4">
      <!-- 分類卡片將由 JavaScript 動態生成 -->
    </div>

    <!-- 空狀態 -->
    <div id="emptyState" class="empty-state hidden">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
      </svg>
      <h3>尚無清單</h3>
      <p>資料載入中...</p>
    </div>
  </main>

  <!-- 底部進度條 -->
  <footer class="footer-container">
    <div class="footer-content">
      <div class="progress-header">
        <span id="progressSlogan" class="progress-slogan text-gray-600">開始整理行李吧！</span>
        <div class="progress-count">
          <span id="bannerCheckedCount" class="checked">0</span>
          <span class="divider">/</span>
          <span id="bannerTotalCount" class="total">0</span>
        </div>
      </div>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar-fill level-0" style="width: 0%">
          <span id="progressText" class="progress-percentage">0%</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- 全螢幕選單 -->
  <div id="fullscreenMenu" class="fullscreen-menu">
    <div class="fullscreen-menu-content">
      <!-- 選單標題 -->
      <div class="fullscreen-menu-header">
        <div class="fullscreen-menu-title">
          <span class="fullscreen-menu-title-icon">⚙️</span>
          <span>功能選單</span>
        </div>
        <button id="closeMenuBtn" class="fullscreen-menu-close">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- 選單內容 -->
      <div class="fullscreen-menu-body">
        <button id="addCategoryBtn" class="menu-item">
          <div class="menu-item-icon blue">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </div>
          <div class="menu-item-text">
            <div class="menu-item-title">新增分類</div>
            <div class="menu-item-desc">建立新的物品分類</div>
          </div>
        </button>

        <button id="exportChecklistBtn" class="menu-item">
          <div class="menu-item-icon green">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
            </svg>
          </div>
          <div class="menu-item-text">
            <div class="menu-item-title">儲存清單</div>
            <div class="menu-item-desc">將目前清單儲存備份</div>
          </div>
        </button>

        <button id="importChecklistBtn" class="menu-item">
          <div class="menu-item-icon purple">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
          </div>
          <div class="menu-item-text">
            <div class="menu-item-title">載入清單</div>
            <div class="menu-item-desc">載入已儲存的清單</div>
          </div>
        </button>

        <button id="resetAllBtn" class="menu-item">
          <div class="menu-item-icon orange">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </div>
          <div class="menu-item-text">
            <div class="menu-item-title">重設清單</div>
            <div class="menu-item-desc">清除勾選或恢復預設</div>
          </div>
        </button>
      </div>

      <!-- 選單底部 -->
      <div class="fullscreen-menu-footer">
        <strong>旅遊清單檢查</strong>
        v1.1.0 • Made with ❤️
      </div>
    </div>
  </div>

  <!-- 隱藏的檔案輸入 -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;">

  <!-- JavaScript 模組 -->
  <script src="assets/js/storage.js?v=8"></script>
  <script src="assets/js/user.js?v=8"></script>
  <script src="assets/js/checklist.js?v=8"></script>
  <script src="assets/js/app.js?v=9"></script>

  <!-- PWA 註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker 註冊成功:', reg))
          .catch(err => console.error('Service Worker 註冊失敗:', err));
      });
    }
  </script>
</body>
</html>
